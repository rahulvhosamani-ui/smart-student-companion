<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #121214;
            color: white;
            padding: 20px;
        }

        .register-card {
            width: 100%;
            max-width: 430px;
            background: #1e1e24;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #333;
        }

        h1 {
            text-align: center;
            color: #52b788;
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #bdbdbd;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #2a2a35;
            color: white;
            border: 1px solid #393943;
            border-radius: 8px;
        }

        input:focus {
            outline: 2px solid #52b788;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #52b788;
            color: #121214;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #40916c;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #52b788;
            text-decoration: none;
        }

        .message {
            color: #ff6b6b;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="register-card">
        <h1>🎓 Create Account</h1>
        <p>Join Smart Student Companion</p>

        <div class="message"
             th:if="${error}"
             th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <label for="name">Full Name</label>
            <input id="name"
                   type="text"
                   name="name"
                   placeholder="Enter your name"
                   maxlength="100"
                   required>

            <label for="email">Email</label>
            <input id="email"
                   type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <label for="password">Password</label>
            <input id="password"
                   type="password"
                   name="password"
                   placeholder="Create a password"
                   minlength="8"
                   required>

            <button type="submit">Register</button>
        </form>

        <a class="login-link" href="/index.html">
            Already registered? Login
        </a>
    </div>
</body>
</html>
