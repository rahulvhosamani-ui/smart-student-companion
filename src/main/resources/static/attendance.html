<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Attendance Tracker</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#121214;
    color:white;
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:250px;
    background:#1e1e24;
    padding:20px;
}

.logo{
    text-align:center;
    color:#52b788;
    margin-bottom:30px;
}

.menu{
    list-style:none;
}

.menu li{
    margin:10px 0;
}

.menu a{
    display:block;
    text-decoration:none;
    color:white;
    padding:12px;
    border-radius:8px;
}

.menu a:hover{
    background:#2a2a35;
    color:#52b788;
}

.content{
    flex:1;
    padding:30px;
}

.card{
    background:#1e1e24;
    padding:25px;
    border-radius:12px;
    border:1px solid #333;
}

h1{
    color:#52b788;
    margin-bottom:10px;
}

.subtitle{
    color:#bdbdbd;
    margin-bottom:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:#2a2a35;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

.stat-card h3{
    color:#52b788;
    margin-bottom:10px;
}

.stat-value{
    font-size:26px;
    font-weight:bold;
}

input{
    width:100%;
    background:#2a2a35;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px;
    margin-bottom:15px;
}

button{
    background:#52b788;
    color:#121214;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#40916c;
}

.attendance-list{
    margin-top:25px;
}

.attendance-card{
    background:#2a2a35;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

.subject{
    color:#52b788;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.progress{
    height:12px;
    background:#444;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.progress-fill{
    height:100%;
    background:#52b788;
}

.percent{
    margin-top:10px;
    font-weight:bold;
}

.warning{
    color:#ff4d4d;
    margin-top:8px;
}

.good{
    color:#52b788;
    margin-top:8px;
}

</style>

</head>

<body>

<div class="sidebar">

    <h2 class="logo">🎓 Smart Student</h2>

    <ul class="menu">
        <li><a href="dashboard.html">🏠 Dashboard</a></li>
        <li><a href="notes.html">📚 Notes</a></li>
        <li><a href="assignments.html">📝 Assignments</a></li>
        <li><a href="attendance.html">📅 Attendance</a></li>
        <li><a href="gpa.html">📊 GPA Tracker</a></li>
        <li><a href="reminders.html">⏰ Reminders</a></li>
        <li><a href="ainotes.html">🤖 AI Notes</a></li>
        <li><a href="flashcards.html">📖 Flashcards</a></li>
        <li><a href="chatbot.html">🤖 AI Assistant</a></li>
    </ul>

</div>

<div class="content">

<div class="card">

    <h1>📅 Attendance Tracker</h1>

    <p class="subtitle">
        Monitor subject-wise attendance and stay above 75%.
    </p>

    <div class="stats">

        <div class="stat-card">
            <h3>Overall Attendance</h3>
            <div id="overallAttendance"
                 class="stat-value">
                 0%
            </div>
        </div>

        <div class="stat-card">
            <h3>Total Subjects</h3>
            <div id="subjectCount"
                 class="stat-value">
                 0
            </div>
        </div>

    </div>

    <input
        type="text"
        id="subject"
        placeholder="Subject Name">

    <input
        type="number"
        id="percentage"
        placeholder="Attendance Percentage">

    <button onclick="saveAttendance()">
        Save Attendance
    </button>

    <div id="attendanceList"
         class="attendance-list">
    </div>

</div>

</div>

<script>

loadAttendance();

async function loadAttendance(){

    try{

        const response =
            await fetch("/api/attendance");

        const records =
            await response.json();

        let html = "";
        let total = 0;

        records.forEach(record=>{

            total += Number(record.percentage);

            html += `

            <div class="attendance-card">

                <div class="subject">
                    ${record.subject}
                </div>

                <div class="progress">

                    <div class="progress-fill"
                         style="width:${record.percentage}%">
                    </div>

                </div>

                <div class="percent">
                    ${record.percentage}%
                </div>

                ${
                    record.percentage < 75

                    ?

                    `<div class="warning">
                        Attendance Below 75%
                    </div>`

                    :

                    `<div class="good">
                        Good Attendance
                    </div>`
                }

            </div>

            `;

        });

        document.getElementById(
            "attendanceList"
        ).innerHTML = html;

        document.getElementById(
            "subjectCount"
        ).innerText = records.length;

        if(records.length > 0){

            document.getElementById(
                "overallAttendance"
            ).innerText =
                (total / records.length).toFixed(1) + "%";
        }

    }
    catch(error){

        console.log(error);

    }
}

async function saveAttendance(){

    const subject =
        document.getElementById("subject").value;

    const percentage =
        document.getElementById("percentage").value;

    if(subject.trim()==="" ||
       percentage===""){

        alert("Please fill all fields");
        return;
    }

    await fetch("/api/attendance",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            subject:subject,
            percentage:percentage

        })

    });

    document.getElementById("subject").value="";
    document.getElementById("percentage").value="";

    loadAttendance();
}


</script>

</body>
</html>
