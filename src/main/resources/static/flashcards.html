<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcards</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#121214;
    color:white;
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:250px;
    background:#1e1e24;
    padding:20px;
}

.logo{
    text-align:center;
    color:#52b788;
    margin-bottom:30px;
}

.menu{
    list-style:none;
}

.menu li{
    margin:10px 0;
}

.menu a{
    display:block;
    padding:12px;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.menu a:hover{
    background:#2a2a35;
    color:#52b788;
}

.content{
    flex:1;
    padding:30px;
}

.card{
    background:#1e1e24;
    border:1px solid #333;
    border-radius:12px;
    padding:25px;
}

h1{
    color:#52b788;
    margin-bottom:10px;
}

.subtitle{
    color:#bdbdbd;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
    background:#2a2a35;
    color:white;
}

button{
    background:#52b788;
    color:#121214;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#40916c;
}

.flashcard-container{
    margin-top:25px;
}

.flashcard{

    background:#2a2a35;

    border-radius:12px;

    padding:25px;

    margin-top:15px;

    cursor:pointer;

    min-height:180px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    font-size:20px;

    font-weight:bold;

    transition:0.3s;
}

.flashcard:hover{

    transform:scale(1.02);

}

.front{
    color:#52b788;
}

.back{
    color:white;
}

.actions{

    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.count{

    margin-top:15px;

    color:#52b788;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="sidebar">

    <h2 class="logo">🎓 Smart Student</h2>

    <ul class="menu">
        <li><a href="dashboard.html">🏠 Dashboard</a></li>
        <li><a href="notes.html">📚 Notes</a></li>
        <li><a href="assignments.html">📝 Assignments</a></li>
        <li><a href="attendance.html">📅 Attendance</a></li>
        <li><a href="gpa.html">📊 GPA Tracker</a></li>
        <li><a href="reminders.html">⏰ Reminders</a></li>
        <li><a href="ainotes.html">🤖 AI Notes</a></li>
        <li><a href="flashcards.html">📖 Flashcards</a></li>
        <li><a href="chatbot.html">🤖 AI Assistant</a></li>
    </ul>

</div>

<div class="content">

<div class="card">

    <h1>📖 Flashcards</h1>

    <p class="subtitle">
        Create and review study flashcards.
    </p>

    <input
        type="text"
        id="question"
        placeholder="Enter Question">

    <input
        type="text"
        id="answer"
        placeholder="Enter Answer">

    <button onclick="addFlashcard()">
        Add Flashcard
    </button>

    <div class="count" id="cardCount">
        Total Cards: 0
    </div>

    <div
        class="flashcard-container"
        id="flashcardContainer">

    </div>

</div>

</div>

<script>

let flashcards = [];

function addFlashcard(){

    const question =
        document.getElementById("question").value;

    const answer =
        document.getElementById("answer").value;

    if(question.trim()==="" ||
       answer.trim()===""){

        alert("Enter both question and answer");
        return;
    }

    flashcards.push({
        question:question,
        answer:answer,
        flipped:false
    });

    document.getElementById("question").value="";
    document.getElementById("answer").value="";

    renderFlashcards();
}

function renderFlashcards(){

    let html = "";

    flashcards.forEach((card,index)=>{

        html += `

        <div class="flashcard"
             onclick="flipCard(${index})">

            ${
                card.flipped
                ?

                `<div class="back">
                    ${card.answer}
                </div>`

                :

                `<div class="front">
                    ${card.question}
                </div>`
            }

        </div>

        `;

    });

    document.getElementById(
        "flashcardContainer"
    ).innerHTML = html;

    document.getElementById(
        "cardCount"
    ).innerText =
    "Total Cards: " + flashcards.length;
}

function flipCard(index){

    flashcards[index].flipped =
        !flashcards[index].flipped;

    renderFlashcards();

}

</script>

</body>
</html>
``
