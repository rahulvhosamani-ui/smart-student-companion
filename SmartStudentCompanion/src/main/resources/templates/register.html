<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#52b788">

    <title>Create Account | Smart Student Companion</title>

    <style>
        :root {
            --bg: #0b110e;
            --panel: #121b16;
            --green: #52b788;
            --green-dark: #40916c;
            --text: #edf7f0;
            --muted: #9aaea1;
            --border: #2b3b31;
            --red: #ff7777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left,
                        rgba(82, 183, 136, .15),
                        transparent 40%),
                var(--bg);
            color: var(--text);
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .4);
        }

        .brand {
            color: var(--green);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 18px;
            text-align: center;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            height: 50px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0d1510;
            color: var(--text);
            padding: 0 14px;
            font-size: 15px;
        }

        .field input:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.2);
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
        }

        .strength {
            margin-top: 7px;
            font-size: 13px;
        }

        .btn {
            width: 100%;
            height: 52px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: var(--green);
            color: #07160d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: var(--green-dark);
            color: white;
        }

        .msg {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .error {
            background: rgba(255, 119, 119, 0.15);
            border: 1px solid rgba(255, 119, 119, 0.4);
            color: #ffd2d2;
        }

        .foot {
            margin-top: 22px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        a {
            color: var(--green);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 25px;
            }

            h1 {
                font-size: 27px;
            }

            .brand {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            .card {
                padding: 20px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
            }

            .brand {
                font-size: 20px;
            }

            .subtitle {
                font-size: 13px;
            }

            .field input {
                height: 46px;
                font-size: 14px;
            }

            .btn {
                height: 48px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<main class="card">

    <div class="brand">
        🎓 Smart Student Companion
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Organize your studies, notes, attendance,
        GPA and assignments in one place.
    </p>

    <div class="msg error"
         role="alert"
         th:if="${error}"
         th:text="${error}">
        Registration failed.
    </div>

    <form th:action="@{/register}"
          action="/register"
          method="post">

        <div class="field">
            <label for="name">Full Name</label>
            <input
                    id="name"
                    name="name"
                    type="text"
                    maxlength="100"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>
        </div>

        <div class="field">
            <label for="email">Email Address</label>
            <input
                    id="email"
                    name="email"
                    type="email"
                    maxlength="254"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required>
        </div>

        <div class="field">

            <label for="password">Password</label>

            <div class="password-container">

                <input
                        id="password"
                        name="password"
                        type="password"
                        minlength="8"
                        maxlength="72"
                        placeholder="Minimum 8 characters"
                        autocomplete="new-password"
                        required>

                <span class="toggle-password"
                      onclick="togglePassword()">
                    👁
                </span>

            </div>

            <div id="strength" class="strength"></div>

        </div>

        <button type="submit" class="btn">
            Create Account →
        </button>

    </form>

    <p class="foot">
        Already registered?
        <a th:href="@{/login}" href="/login">
            Sign In
        </a>
    </p>

</main>

<script>
    function togglePassword() {

        const password =
            document.getElementById("password");

        password.type =
            password.type === "password"
                ? "text"
                : "password";
    }

    document
        .getElementById("password")
        .addEventListener("input", function () {

            const value = this.value;
            const strength =
                document.getElementById("strength");

            if (!value) {
                strength.textContent = "";
            } else if (value.length < 8) {
                strength.textContent = "Weak password";
                strength.style.color = "#ff7777";
            } else if (value.length < 12) {
                strength.textContent = "Medium password";
                strength.style.color = "#ffc107";
            } else {
                strength.textContent = "Strong password";
                strength.style.color = "#52b788";
            }
        });
</script>

</body>
</html>
