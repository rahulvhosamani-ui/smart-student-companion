<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101814"><title>Create account | Smart Student Companion</title>
<style>
:root{color-scheme:dark;--bg:#0b110e;--panel:#121b16;--green:#52b788;--text:#edf7f0;--muted:#9aaea1;--border:#2b3b31;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 10% 10%,#52b78820,transparent 40%),var(--bg);color:var(--text);font:15px Inter,"Segoe UI",Arial,sans-serif}
.card{width:100%;max-width:460px;padding:34px;background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:0 25px 70px #0005}.brand{color:var(--green);font-weight:800;letter-spacing:.2px}.card h1{margin:18px 0 8px;font-size:30px}.muted{color:var(--muted);line-height:1.6;font-size:13px}.field{margin-top:18px}.field label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}.field input{width:100%;height:48px;border-radius:10px;border:1px solid var(--border);background:#0d1510;color:var(--text);padding:0 13px;outline:none}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px #52b78820}.btn{margin-top:24px;width:100%;height:49px;border:0;border-radius:10px;background:var(--green);color:#092016;font-weight:800;cursor:pointer}.btn:hover{background:#69d39d}.msg{margin-top:16px;padding:12px;border-radius:9px;font-size:13px}.error{color:#ffd0d0;background:#ff5a5a18;border:1px solid #ff5a5a55}.foot{text-align:center;margin-top:22px;color:var(--muted);font-size:13px}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}
</style></head><body><main class="card"><div class="brand">✦ Smart Student Companion</div><h1>Create your account</h1><p class="muted">Organize your studies, notes, attendance, GPA and assignments in one place.</p>
<div class="msg error" role="alert" th:if="${error}" th:text="${error}">Please check your details.</div>
<form th:action="@{/register}" action="/register" method="post">
<div class="field"><label for="name">Full name</label><input id="name" name="name" type="text" maxlength="100" autocomplete="name" placeholder="Your full name" required></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="At least 8 characters" required></div>
<button class="btn" type="submit">Create account →</button></form><p class="foot">Already registered? <a th:href="@{/login}" href="/login">Sign in</a></p></main></body></html>
