# Use local profile on a developer machine; set SPRING_PROFILES_ACTIVE=prod on Railway.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Local defaults can be overridden with DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_companion_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional Gemini integration. Set GEMINI_API_KEY in environment variables.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}

server.port=${PORT:8081}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.tomcat.redirect-context-root=false
