<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Forgot Password</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#121214;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.card{

    width:400px;

    background:#1e1e24;

    padding:30px;

    border-radius:15px;

    border:1px solid #333;
}

h2{

    color:#52b788;

    text-align:center;

    margin-bottom:15px;
}

p{

    color:#bdbdbd;

    margin-bottom:20px;

    text-align:center;
}

input{

    width:100%;

    padding:12px;

    background:#2a2a35;

    border:none;

    border-radius:8px;

    color:white;

    margin-bottom:15px;
}

button{

    width:100%;

    padding:12px;

    background:#52b788;

    border:none;

    border-radius:8px;

    color:#121214;

    font-weight:bold;

    cursor:pointer;
}

button:hover{

    background:#40916c;

}

.back-link{

    display:block;

    margin-top:15px;

    text-align:center;

    color:#52b788;

    text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

    <h2>Forgot Password</h2>

    <p>
        Enter your email and we'll help you reset your password.
    </p>

    <input
        type="email"
        placeholder="Enter Email">

    <button>
        Send Reset Link
    </button>

    <a
        class="back-link"
        href="index.html">

        Back to Login

    </a>

</div>

</body>
</html>
